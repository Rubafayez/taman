# إعدادات النشر على Netlify: الواجهة ملفات ثابتة من dist، وطلبات الذكاء الاصطناعي تمر من دالة في الخادم
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
